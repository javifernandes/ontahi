name: npm prerelease

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, or publish the exact prerelease
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      version:
        description: Exact committed lockstep package version from the release pull request
        required: true
        type: string
      channel:
        description: npm dist-tag matching the prerelease identifier
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - next

permissions:
  contents: read

env:
  NPM_VERSION: '11.17.0'
  PNPM_VERSION: '10.33.0'
  RELEASE_OUTPUT: .artifacts/npm

jobs:
  resolve:
    name: Resolve immutable release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main')
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      commit: ${{ steps.release.outputs.commit }}
      mode: ${{ steps.release.outputs.mode }}
      pull_request: ${{ steps.release.outputs.pull_request }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Resolve release inputs
        id: release
        env:
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          RELEASE_PULL_REQUEST: ${{ github.event.pull_request.number }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release/resolve-release.mjs

  preflight:
    name: Build and dry-run every package
    needs: resolve
    runs-on: ubuntu-latest
    env:
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node for npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin trusted-publishing npm CLI
        run: npm install --global "npm@$NPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm build:packages

      - name: Verify publishable artifacts
        run: pnpm verify:artifacts -- --skip-build

      - name: Prepare release tarballs
        run: >-
          pnpm release:npm:prepare --
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_CHANNEL"
          --output "$RELEASE_OUTPUT/$RELEASE_VERSION"

      - name: Dry-run npm publication
        run: >-
          pnpm release:npm:dry-run --
          --manifest "$RELEASE_OUTPUT/$RELEASE_VERSION/release-manifest.json"

  publish:
    name: Publish every package
    if: needs.resolve.outputs.mode == 'publish'
    needs: [resolve, preflight]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node for npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin trusted-publishing npm CLI
        run: npm install --global "npm@$NPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm build:packages

      - name: Prepare immutable release tarballs
        run: >-
          pnpm release:npm:prepare --
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_CHANNEL"
          --output "$RELEASE_OUTPUT/$RELEASE_VERSION"

      - name: Publish with npm trusted publishing
        run: >-
          pnpm release:npm:publish --
          --manifest "$RELEASE_OUTPUT/$RELEASE_VERSION/release-manifest.json"

  metadata:
    name: Tag and create GitHub prerelease
    if: >-
      always() && needs.resolve.outputs.mode == 'publish' &&
      needs.publish.result == 'success'
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      RELEASE_PULL_REQUEST: ${{ needs.resolve.outputs.pull_request }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Create immutable GitHub prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/github-release.mjs
