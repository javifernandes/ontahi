name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.33.0'

jobs:
  changes:
    name: Detect framework changes
    runs-on: ubuntu-latest
    outputs:
      framework: ${{ steps.scope.outputs.framework }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "framework=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$HEAD_SHA^"
          fi

          framework=false
          website_manifest_changed=false
          lockfile_changed=false

          while IFS= read -r path; do
            case "$path" in
              apps/www/package.json)
                website_manifest_changed=true
                ;;
              apps/www/*|*.md|docs/*|books/*|.github/workflows/pages.yml)
                ;;
              pnpm-lock.yaml)
                lockfile_changed=true
                ;;
              *)
                framework=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if [[ "$lockfile_changed" == "true" && "$website_manifest_changed" != "true" ]]; then
            framework=true
          fi

          echo "framework=$framework" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality and package artifacts
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Changesets state
        # The generated version PR has already consumed its changesets into package versions and
        # changelogs. Every source PR and direct main run must still carry a valid changeset.
        if: >-
          needs.changes.outputs.framework == 'true' &&
          github.head_ref != 'changeset-release/main' &&
          github.ref_name != 'changeset-release/main'
        run: pnpm exec changeset status --since=origin/main

      - name: Validate generated release pull request
        if: github.head_ref == 'changeset-release/main' || github.ref_name == 'changeset-release/main'
        env:
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/release-pr.mjs validate --base origin/main --head "$RELEASE_HEAD"

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: >-
          ${{ needs.changes.outputs.framework == 'true'
          && 'pnpm lint'
          || 'pnpm --filter @ontahi/www lint' }}

      - name: Build framework and website
        run: >-
          ${{ needs.changes.outputs.framework == 'true'
          && 'pnpm build'
          || 'pnpm --filter @ontahi/www build' }}

      - name: Typecheck
        if: needs.changes.outputs.framework == 'true'
        run: pnpm typecheck

      - name: Build Todo Express example
        if: needs.changes.outputs.framework == 'true'
        run: pnpm todo:build

      - name: Verify publishable artifacts
        if: needs.changes.outputs.framework == 'true'
        run: pnpm verify:artifacts -- --skip-build

  tests:
    name: Tests (Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ontahi
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=ontahi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
      id-token: write
    env:
      ONTAHI_POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/ontahi
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build package dependencies
        run: pnpm build:packages

      - name: Test packages on minimum Node
        if: matrix.node-version == '20.19.0'
        run: pnpm test:packages

      - name: Test packages with coverage
        if: matrix.node-version == '24'
        run: pnpm test:coverage:packages

      - name: Test examples
        run: pnpm test:examples

      - name: Upload test results to Codecov
        if: matrix.node-version == '24' && !cancelled()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          use_oidc: true
          fail_ci_if_error: false
          report_type: test_results
          name: ontahi-node-24

      - name: Upload coverage to Codecov
        if: matrix.node-version == '24'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          use_oidc: true
          fail_ci_if_error: false
          name: ontahi-packages

  release-pr-statuses:
    name: Record release pull request checks
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.ref_name == 'changeset-release/main'
    needs: [changes, quality, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish required commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          publish_status() {
            local context="$1"
            local result="$2"
            local state="failure"
            if [[ "$result" == "success" ]]; then
              state="success"
            fi

            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context="$context" \
              -f description="Result mirrored from the bot-dispatched CI workflow" \
              -f target_url="$target_url"
          }

          publish_status "Quality and package artifacts" "$QUALITY_RESULT"
          publish_status "Tests (Node 20.19.0)" "$TESTS_RESULT"
          publish_status "Tests (Node 24)" "$TESTS_RESULT"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
