services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ontahi_todos
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '54329:5432'
    volumes:
      - todo-postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ontahi_todos']
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  todo-postgres-data:
