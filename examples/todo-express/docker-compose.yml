services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ontahi_todos
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '54329:5432'
    volumes:
      - todo-postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ontahi_todos']
      interval: 1s
      timeout: 3s
      retries: 30

  mysql:
    profiles: [mysql]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ontahi_todos
      MYSQL_ROOT_PASSWORD: ${TODO_MYSQL_PASSWORD:-}
    ports:
      - '33069:3306'
    volumes:
      - todo-mysql-data:/var/lib/mysql
      - ./migrations-mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent',
        ]
      interval: 1s
      timeout: 3s
      retries: 60

volumes:
  todo-postgres-data:
  todo-mysql-data:
